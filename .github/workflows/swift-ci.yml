name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/'
      - 'Tests/'
      - '.swift-format'
  pull_request:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/'
      - 'Tests/'
      - '.swift-format'
      - '.github/workflows/swift-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: "🎨 Format Check"
    runs-on: macos-26
    steps:
      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.12.0
        with:
          swift-version: '6.2'

      - name: ⬇️ Get Sources
        uses: actions/checkout@v5.0.0

      - name: 🎨 Check Formatting
        run: |
          echo "=== Running swift format lint ==="
          if [ -f ".swift-format" ]; then
            swift format lint --strict --recursive --configuration .swift-format .
          else
            echo "⚠️  .swift-format not found, using defaults"
            swift format lint --strict --recursive .
          fi
          echo "✅ Formatting check passed"

  apple-tests:
    name: "🍎 Apple Tests - ${{ matrix.name }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: "platform=iOS Simulator,arch=arm64,name=iPhone 17 Pro,OS=26.5"
            name: "iOS"
          - destination: "platform=iOS Simulator,arch=arm64,name=iPad (A16),OS=26.5"
            name: "iPadOS"
          - destination: "platform=watchOS Simulator,arch=arm64,name=Apple Watch Series 11 (42mm),OS=26.5"
            name: "watchOS"
          - destination: "platform=tvOS Simulator,arch=arm64,name=Apple TV 4K (3rd generation) (at 1080p),OS=26.5"
            name: "tvOS"
          - destination: "platform=visionOS Simulator,arch=arm64,name=Apple Vision Pro,OS=26.5"
            name: "visionOS"
          - destination: "platform=macOS,arch=arm64,name=My Mac"
            name: "macOS"
          - destination: "platform=macOS,arch=arm64,variant=Mac Catalyst,name=My Mac"
            name: "macOS Catalyst"
    runs-on: macos-26
    steps:
      - name: ⬇️ Get Sources
        uses: actions/checkout@v5.0.0

      - name: 🍺 Homebrew Dependencies
        run: brew install xcbeautify

      - name: ☑️ Xcode Select
        run: sudo xcode-select -switch /Applications/Xcode_26.6.app

      - name: ⚒️ Build Package
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail && xcodebuild build-for-testing \
            -scheme "request-dl" \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath .xcbuild 2>&1 | xcbeautify --quiet --renderer github-actions

      - name: 🧪 Run Tests with Coverage
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail && xcodebuild test-without-building \
            -scheme "request-dl" \
            -destination "${{ matrix.destination }}" \
            -enableCodeCoverage YES \
            -derivedDataPath .xcbuild 2>&1 | xcbeautify --renderer github-actions

      - name: 🔍 Debug - List coverage files
        run: |
          echo "=== Looking for coverage files ==="
          find .xcbuild -name "*.profdata" -o -name "*.xctest" 2>/dev/null || echo "No files found"

      - name: 🔀 Move Coverage Files
        run: |
          mkdir -p coverage-artifacts
          find .xcbuild -name "*.profdata" -exec cp {} coverage-artifacts/ \; 2>/dev/null || true
          find .xcbuild -name "*.xctest" -not -path "*/.dSYM/*" -exec cp -r {} coverage-artifacts/ \; 2>/dev/null || true
          echo "=== Files moved to coverage-artifacts ==="
          ls -la coverage-artifacts/

      - name: 📤 Upload Coverage Data
        uses: actions/upload-artifact@v4.6.2
        with:
          name: apple-${{ matrix.name }}
          path: coverage-artifacts/

  third-party-tests:
    name: "🔧 Third Party - ${{ matrix.name }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"
            name: "Linux"
          # - platform: "windows-latest"
          #   name: "Windows"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.12.0
        with:
          swift-version: '6.2'

      - name: ⬇️ Get Sources
        uses: actions/checkout@v5.0.0

      - name: ⚒️ Test Package
        run: swift test --enable-code-coverage

      - name: 🧪 Test Package (FoundationEssentials)
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: |
          echo "=== Running tests with USE_ESSENTIALS_ONLY flag ==="
          swift test --enable-code-coverage -Xswiftc -DUSE_ESSENTIALS_ONLY

      - name: 🔍 Debug - List coverage files (Unix)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          echo "=== Looking for coverage files ==="
          find .build -name "*.profdata" -o -name "*.xctest" 2>/dev/null || echo "No files found"

      - name: 🔍 Debug - List coverage files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Looking for coverage files ==="
          Get-ChildItem -Path .build -Recurse -Include "*.profdata", "*.xctest" -ErrorAction SilentlyContinue

      - name: 🔀 Move Coverage Files (Unix)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          mkdir -p coverage-artifacts
          find .build -name "*.profdata" -exec cp {} coverage-artifacts/ \; 2>/dev/null || true
          find .build -name "*.xctest" -not -path "*/.dSYM/*" -exec cp -r {} coverage-artifacts/ \; 2>/dev/null || true
          echo "=== Files moved to coverage-artifacts ==="
          ls -la coverage-artifacts/

      - name: 🔀 Move Coverage Files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "coverage-artifacts" -Force
          Get-ChildItem -Path .build -Recurse -Filter "*.profdata" | ForEach-Object {
              Copy-Item $_.FullName -Destination "coverage-artifacts" -Force
          }
          Get-ChildItem -Path .build -Recurse -Directory -Filter "*.xctest" | Where-Object {
              $_.FullName -notlike "*\.dSYM\*"
          } | ForEach-Object {
              Copy-Item $_.FullName -Destination "coverage-artifacts" -Recurse -Force
          }
          Write-Host "=== Files moved to coverage-artifacts ==="
          Get-ChildItem -Path "coverage-artifacts"

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: third-party-${{ matrix.name }}
          path: coverage-artifacts/

  wasm-tests:
    name: "🕸️ WebAssembly"
    runs-on: macos-26
    continue-on-error: true
    steps:
      - name: ⬇️ Get Sources
        uses: actions/checkout@v5.0.0

      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.12.0
        with:
          swift-version: '6.2'

      - name: 📦 Install Carton
        run: |
          echo "=== Installing carton ==="
          brew install swiftwasm/tap/carton
          carton --version

      - name: 🕸️ Build for WebAssembly
        run: carton bundle

      - name: 🧪 Run WebAssembly Tests
        run: carton test

  breaking-changes:
    name: "💔 Breaking Changes"
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.12.0
        with:
          swift-version: '6.2'

      - name: ⬇️ Get Sources
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: 💔 Checking API Breaking Changes
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$latest_tag" ]; then
            echo "No tags found, skipping breaking changes check"
            exit 0
          fi
          echo "Latest tag: $latest_tag"

          # Check for major version bump
          tag_version="${latest_tag#v}"
          latest_major=$(echo "$tag_version" | cut -d. -f1)

          current_ref="${{ github.ref_name }}"
          ref_version="${current_ref#v}"
          current_major=$(echo "$ref_version" | cut -d. -f1)

          if [[ "$latest_major" =~ ^[0-9]+$ ]] && [[ "$current_major" =~ ^[0-9]+$ ]]; then
            if [ "$latest_major" != "$current_major" ]; then
              echo "⚠️  Major version bump detected ($latest_tag -> $current_ref)"
              echo "Skipping breaking changes check"
              exit 0
            fi
          fi

          echo "Checking breaking changes against $latest_tag"
          swift package diagnose-api-breaking-changes $latest_tag

  coverage-upload:
    name: "📤 Coverage Upload"
    runs-on: macos-26
    needs: [apple-tests, third-party-tests]
    if: always()
    steps:
      - name: ⬇️ Get Sources
        uses: actions/checkout@v5.0.0

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v5.0.0
        with:
          path: artifacts

      - name: 📁 List Downloaded Artifacts
        run: |
          echo "Artifacts downloaded:"
          ls -la artifacts/
          echo "Subdirectories:"
          find artifacts -type d -mindepth 1 -maxdepth 1

      - name: ☑️ Xcode Select
        run: sudo xcode-select -switch /Applications/Xcode_26.6.app

      - name: 📁 Process Coverage for Each Destination
        run: |
          for artifact_dir in artifacts/*/; do
            if [ -d "$artifact_dir" ]; then
              echo "=== Processing: $artifact_dir ==="
              (
                cd "$artifact_dir"
                ARTIFACT_DIR_NAME=$(basename "$artifact_dir")
                PROFDATA_FILE=$(find . -name "*.profdata" | head -n 1)
                if [ -z "$PROFDATA_FILE" ]; then
                  echo "Nenhum arquivo .profdata encontrado em $artifact_dir"
                  exit 1
                fi
                find . -name "*.xctest" -type d | while read -r xctest_bundle; do
                  if [ -n "$xctest_bundle" ]; then
                    BUNDLE_NAME=$(basename "$xctest_bundle" .xctest)
                    EXECUTABLE_PATH=$(find "$xctest_bundle" -name "$BUNDLE_NAME" -type f -not -path "*/.dSYM/*" | head -n 1)
                    if [ -n "$EXECUTABLE_PATH" ] && [ -f "$EXECUTABLE_PATH" ]; then
                      echo "Processando cobertura para: $BUNDLE_NAME"
                      echo "Executável encontrado em: $EXECUTABLE_PATH"
                      OUTPUT_FILE="${{ github.workspace }}/${ARTIFACT_DIR_NAME}.lcov"
                      xcrun llvm-cov export "$EXECUTABLE_PATH" \
                        -format="lcov" \
                        -instr-profile="$PROFDATA_FILE" \
                        -ignore-filename-regex=".build|Tests" > "$OUTPUT_FILE"
                      echo "Gerado: $OUTPUT_FILE"
                    else
                      echo "Executável não encontrado para: $BUNDLE_NAME"
                    fi
                  fi
                done
              )
            fi
          done

      - name: 📋 List Generated LCOV Files
        run: |
          echo "LCOV files generated:"
          ls -la *.lcov

      - name: 📦 Upload to Codecov
        uses: codecov/codecov-action@v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "*.lcov"
          verbose: true
