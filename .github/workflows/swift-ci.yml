name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/'
      - 'Tests/'
      - '.swift-format'
  pull_request:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/'
      - 'Tests/'
      - '.swift-format'
      - '.github/workflows/swift-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # ETAPA 1: Validação de formatação
  # ═══════════════════════════════════════════════════════════════
  format-check:
    name: "🎨 Format Check"
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: '6.3'

      - name: ⬇️ Get Sources
        uses: actions/checkout@v6.0.2

      - name: 🎨 Check Formatting
        run: |
          echo "=== Running swift format lint ==="
          if [ -f ".swift-format" ]; then
            swift format lint --strict --recursive --configuration .swift-format .
          else
            echo "⚠️  .swift-format not found, using defaults"
            swift format lint --strict --recursive .
          fi
          echo "✅ Formatting check passed"

  # ═══════════════════════════════════════════════════════════════
  # ETAPA 2: Breaking changes (só após format-check aprovar)
  # ═══════════════════════════════════════════════════════════════
  breaking-changes:
    name: "💔 Breaking Changes"
    needs: format-check
    if: |
      always() &&
      (needs.format-check.result == 'success' || needs.format-check.result == 'skipped') &&
      !contains(github.event.pull_request.labels.*.name, 'major-release') &&
      !contains(github.event.pull_request.labels.*.name, 'breaking-change') &&
      !contains(github.event.pull_request.labels.*.name, 'release/major') &&
      !startsWith(github.head_ref, 'release/v') &&
      !startsWith(github.head_ref, 'v') &&
      github.head_ref != 'major' &&
      github.head_ref != 'next-major'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: '6.3'

      - name: ⬇️ Get Sources
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: 💔 Checking API Breaking Changes
        run: |
          # ── Skip on push to main ────────────────────────────
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Push to main detected, skipping"
            exit 0
          fi

          # ── Detecção automática por major bump ──────────────
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$latest_tag" ]; then
            echo "No tags found, skipping"
            exit 0
          fi
          echo "Latest tag: $latest_tag"

          tag_version="${latest_tag#v}"
          latest_major=$(echo "$tag_version" | cut -d. -f1)
          current_ref="${{ github.ref_name }}"
          ref_version="${current_ref#v}"
          current_major=$(echo "$ref_version" | cut -d. -f1)

          if [[ "$latest_major" =~ ^[0-9]+$ ]] && [[ "$current_major" =~ ^[0-9]+$ ]]; then
            if [ "$latest_major" != "$current_major" ]; then
              echo "⚠️  Major bump detectado ($latest_tag → $current_ref)"
              exit 0
            fi
          fi

          echo "Checking breaking changes against $latest_tag"
          swift package diagnose-api-breaking-changes "$latest_tag"

  # ═══════════════════════════════════════════════════════════════
  # ETAPA 3A: Apple Tests (só após breaking-changes aprovar)
  # ═══════════════════════════════════════════════════════════════
  apple-tests:
    name: "🍎 Apple Tests - ${{ matrix.name }}"
    needs: breaking-changes
    if: |
      always() &&
      (needs.breaking-changes.result == 'success' || needs.breaking-changes.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: "platform=iOS Simulator,arch=arm64,name=iPhone 17 Pro,OS=26.5"
            name: "iOS"
          - destination: "platform=iOS Simulator,arch=arm64,name=iPad (A16),OS=26.5"
            name: "iPadOS"
          - destination: "platform=watchOS Simulator,arch=arm64,name=Apple Watch Series 11 (42mm),OS=26.5"
            name: "watchOS"
          - destination: "platform=tvOS Simulator,arch=arm64,name=Apple TV 4K (3rd generation) (at 1080p),OS=26.5"
            name: "tvOS"
          - destination: "platform=visionOS Simulator,arch=arm64,name=Apple Vision Pro,OS=26.5"
            name: "visionOS"
          - destination: "platform=macOS,arch=arm64,name=My Mac"
            name: "macOS"
          - destination: "platform=macOS,arch=arm64,variant=Mac Catalyst,name=My Mac"
            name: "macOS Catalyst"
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: ⬇️ Get Sources
        uses: actions/checkout@v6.0.2

      - name: 🍺 Homebrew Dependencies
        run: brew install xcbeautify

      - name: ☑️ Xcode Select
        run: sudo xcode-select -switch /Applications/Xcode_26.6.app

      - name: ⚒️ Build Package
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail && xcodebuild build-for-testing \
            -scheme "SwiftAsyncStream-Package" \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath .xcbuild 2>&1 | xcbeautify --quiet --renderer github-actions

      - name: 🧪 Run Tests with Coverage
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail && xcodebuild test-without-building \
            -scheme "SwiftAsyncStream-Package" \
            -destination "${{ matrix.destination }}" \
            -enableCodeCoverage YES \
            -derivedDataPath .xcbuild 2>&1 | xcbeautify --renderer github-actions

      - name: 🔀 Move Coverage Files
        run: |
          mkdir -p coverage-artifacts
          find .xcbuild -name "*.profdata" -exec cp {} coverage-artifacts/ \; 2>/dev/null || true
          find .xcbuild -name "*.xctest" -not -path "*/.dSYM/*" -exec cp -r {} coverage-artifacts/ \; 2>/dev/null || true

      - name: 📤 Upload Coverage Data
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apple-${{ matrix.name }}
          path: coverage-artifacts/

  # ═══════════════════════════════════════════════════════════════
  # ETAPA 3B: Third Party Tests (só após breaking-changes aprovar)
  # ═══════════════════════════════════════════════════════════════
  third-party-tests:
    name: "🔧 Third Party - ${{ matrix.name }}"
    needs: breaking-changes
    if: |
      always() &&
      (needs.breaking-changes.result == 'success' || needs.breaking-changes.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"
            name: "Linux"
          # - platform: "windows-latest"
          #   name: "Windows"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    steps:
      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: '6.2'

      - name: ⬇️ Get Sources
        uses: actions/checkout@v6.0.2

      - name: ⚒️ Test Package
        run: swift test --enable-code-coverage

      - name: 🧪 Test Package (FoundationEssentials)
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: |
          echo "=== Running tests with USE_ESSENTIALS_ONLY flag ==="
          swift test --enable-code-coverage -Xswiftc -DUSE_ESSENTIALS_ONLY

      - name: 🔀 Move Coverage Files (Unix)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          mkdir -p coverage-artifacts
          find .build -name "*.profdata" -exec cp {} coverage-artifacts/ \; 2>/dev/null || true
          find .build -name "*.xctest" -not -path "*/.dSYM/*" -exec cp -r {} coverage-artifacts/ \; 2>/dev/null || true

      - name: 🔀 Move Coverage Files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "coverage-artifacts" -Force
          Get-ChildItem -Path .build -Recurse -Filter "*.profdata" | ForEach-Object {
              Copy-Item $_.FullName -Destination "coverage-artifacts" -Force
          }
          Get-ChildItem -Path .build -Recurse -Directory -Filter "*.xctest" | Where-Object {
              $_.FullName -notlike "*\.dSYM\*"
          } | ForEach-Object {
              Copy-Item $_.FullName -Destination "coverage-artifacts" -Recurse -Force
          }

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: third-party-${{ matrix.name }}
          path: coverage-artifacts/

  # ═══════════════════════════════════════════════════════════════
  # ETAPA 3C: WebAssembly (só após breaking-changes aprovar, não bloqueia)
  # ═══════════════════════════════════════════════════════════════
  wasm-tests:
    name: "🕸️ WebAssembly"
    needs: breaking-changes
    if: |
      always() &&
      (needs.breaking-changes.result == 'success' || needs.breaking-changes.result == 'skipped')
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: ⬇️ Get Sources
        uses: actions/checkout@v6.0.2

      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: '6.2'

      - name: 🕸️ Install WebAssembly SDK
        id: install-sdk
        run: |
          set -ex

          SWIFT_VERSION="6.2"
          SDK_URL="https://download.swift.org/swift-${SWIFT_VERSION}-release/wasm-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz"
          SDK_FILENAME="swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz"

          echo "Downloading SDK from: $SDK_URL"
          curl -fL "$SDK_URL" -o "$SDK_FILENAME"

          echo "File size:"
          ls -lh "$SDK_FILENAME"

          echo "Computing checksum..."
          CHECKSUM=$(swift package compute-checksum "$SDK_FILENAME")
          echo "Checksum: $CHECKSUM"

          echo "Installing SDK..."
          swift sdk install "$SDK_FILENAME" --checksum "$CHECKSUM"

          echo "Full list of installed SDKs:"
          swift sdk list

          # Lista em formato JSON para parsing confiável
          echo "JSON output:"
          swift sdk list --json > sdks.json || true
          cat sdks.json

          # Extrai o ID do SDK que tem 'wasm' no target triple
          SDK_ID=$(swift sdk list --json | jq -r '.[] | select(.targetTriple | contains("wasm")) | .id' | head -n 1)

          # Fallback: se --json falhou, tenta parsing de texto
          if [ -z "$SDK_ID" ] || [ "$SDK_ID" = "null" ]; then
            echo "JSON parsing failed, trying text parsing..."
            SDK_ID=$(swift sdk list | grep -i wasm | awk '{print $1}' | head -n 1)
          fi

          if [ -z "$SDK_ID" ]; then
            echo "❌ ERROR: Could not determine SDK ID"
            swift sdk list
            exit 1
          fi

          echo "✅ SDK_ID=$SDK_ID"
          echo "SDK_ID=$SDK_ID" >> $GITHUB_OUTPUT

          rm "$SDK_FILENAME"

      - name: 🕸️ Build for WebAssembly
        run: swift build --swift-sdk ${{ steps.install-sdk.outputs.SDK_ID }}

      - name: 🧪 Build Tests for WebAssembly
        run: swift build --build-tests --swift-sdk ${{ steps.install-sdk.outputs.SDK_ID }}

      - name: 🏃 Install Wasmtime
        run: brew install wasmtime

      - name: 🧪 Run WebAssembly Tests
        run: |
          PACKAGE_NAME="SwiftAsyncStream"
          SDK_ID="${{ steps.install-sdk.outputs.SDK_ID }}"

          echo "Looking for test bundle with SDK ID: $SDK_ID"
          echo "Contents of .build:"
          ls -la .build/ || true

          # Tenta localizar o .wasm de diferentes maneiras
          TEST_BUNDLE=$(find .build -name "*PackageTests.wasm" -type f 2>/dev/null | head -n 1)

          if [ -z "$TEST_BUNDLE" ]; then
            echo "❌ Test bundle not found"
            find .build -type d -name "*wasm*" 2>/dev/null || true
            find .build -name "*.wasm" 2>/dev/null || true
            exit 1
          fi

          echo "✅ Found test bundle: $TEST_BUNDLE"
          wasmtime --dir . "$TEST_BUNDLE"

  # ═══════════════════════════════════════════════════════════════
  # ETAPA 4: Coverage Upload (só após todos os tests passarem)
  # ═══════════════════════════════════════════════════════════════
  coverage-upload:
    name: "📤 Coverage Upload"
    runs-on: macos-26
    needs: [apple-tests, third-party-tests]
    if: |
      always() &&
      (needs.apple-tests.result != 'cancelled' || needs.third-party-tests.result != 'cancelled')
    timeout-minutes: 15
    steps:
      - name: ⬇️ Get Sources
        uses: actions/checkout@v6.0.2

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: artifacts

      - name: ☑️ Xcode Select
        run: sudo xcode-select -switch /Applications/Xcode_26.6.app

      - name: 📁 Process Coverage for Each Destination
        run: |
          for artifact_dir in artifacts/*/; do
            if [ -d "$artifact_dir" ]; then
              echo "=== Processing: $artifact_dir ==="
              (
                cd "$artifact_dir"
                ARTIFACT_DIR_NAME=$(basename "$artifact_dir")
                PROFDATA_FILE=$(find . -name "*.profdata" | head -n 1)
                if [ -z "$PROFDATA_FILE" ]; then
                  echo "Nenhum arquivo .profdata encontrado em $artifact_dir"
                  exit 1
                fi
                find . -name "*.xctest" -type d | while read -r xctest_bundle; do
                  if [ -n "$xctest_bundle" ]; then
                    BUNDLE_NAME=$(basename "$xctest_bundle" .xctest)
                    EXECUTABLE_PATH=$(find "$xctest_bundle" -name "$BUNDLE_NAME" -type f -not -path "*/.dSYM/*" | head -n 1)
                    if [ -n "$EXECUTABLE_PATH" ] && [ -f "$EXECUTABLE_PATH" ]; then
                      OUTPUT_FILE="${{ github.workspace }}/${ARTIFACT_DIR_NAME}.lcov"
                      xcrun llvm-cov export "$EXECUTABLE_PATH" \
                        -format="lcov" \
                        -instr-profile="$PROFDATA_FILE" \
                        -ignore-filename-regex=".build|Tests" > "$OUTPUT_FILE"
                    fi
                  fi
                done
              )
            fi
          done

      - name: 📦 Upload to Codecov
        uses: codecov/codecov-action@v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "*.lcov"
          verbose: true