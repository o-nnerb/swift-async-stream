name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swift-format'
  pull_request:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swift-format'
      - '.github/workflows/swift-ci.yaml'

# Cancel any in-progress or queued run for the same ref when a new run is
# triggered (e.g. new push), so stale xcodebuild/swift test processes don't
# keep running and don't sit blocking the queue. Pushes to main use
# github.run_id so each run gets its own group instead of sharing one by
# ref — sharing by ref there can make cancel-in-progress try to cancel a
# run against itself while it's inside the reusable "Swift CI" workflow,
# which GitHub Actions reports as a concurrency deadlock.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Swift CI"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: request-dl/.github/.github/workflows/swift-ci.yaml@main
    with:
      name: SwiftAsyncStream
      product-name: SwiftAsyncStream
      swift-version: '6.2'
      platform: macos-26

      # Step 1
      enable-format: true
      format-swift-version: '6.3'

      # Step 2
      enable-breaking-changes: true
      skip-on-major-update: true
      force-skip-breaking-changes: ${{ contains(github.event.pull_request.labels.*.name, 'force-skip-ci') }}

      # Step 3 – Apple
      enable-apple-tests: true
      package-name: "SwiftAsyncStream-Package"
      xcode-version: '26.6'
      apple-coverage-enabled: true

      # Step 3 – Third Party
      enable-third-party-tests: true
      third-party-coverage-enabled: true

      # Step 3 – Linkage Test (FoundationEssentials)
      enable-linkage-test: true

      # Step 3 – Android Build
      enable-android-build: true

      # Step 3 – Release Builds
      enable-release-builds: true

      # Step 4
      enable-coverage-upload: true
    secrets: inherit

  # ═══════════════════════════════════════════════════════════════
  # Sanitizers (Thread + Address com stress tests) — não faz parte do
  # workflow compartilhado, é específico deste pacote.
  # ═══════════════════════════════════════════════════════════════
  sanitizers:
    name: "🛡️ Sanitizers - ${{ matrix.sanitizer }}"
    needs: ci
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: ⬇️ Get Sources
        uses: actions/checkout@v7.0.1

      - name: 🍺 Homebrew Dependencies
        run: brew install xcbeautify

      - name: ☑️ Xcode Select
        run: sudo xcode-select -switch /Applications/Xcode_26.6.app

      - name: ⚒️ Build with Sanitizer
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail && xcodebuild build-for-testing \
            -scheme "SwiftAsyncStream-Package" \
            -destination "platform=macOS,arch=arm64" \
            -enableAddressSanitizer ${{ matrix.sanitizer == 'address' && 'YES' || 'NO' }} \
            -enableThreadSanitizer ${{ matrix.sanitizer == 'thread' && 'YES' || 'NO' }} \
            -derivedDataPath .xcbuild 2>&1 | xcbeautify --quiet --renderer github-actions

      - name: 🧪 Run Tests with Sanitizer (Regular Suite)
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail && xcodebuild test-without-building \
            -scheme "SwiftAsyncStream-Package" \
            -destination "platform=macOS,arch=arm64" \
            -enableAddressSanitizer ${{ matrix.sanitizer == 'address' && 'YES' || 'NO' }} \
            -enableThreadSanitizer ${{ matrix.sanitizer == 'thread' && 'YES' || 'NO' }} \
            -derivedDataPath .xcbuild 2>&1 | xcbeautify --renderer github-actions

      - name: 🔥 Run Stress Tests with Sanitizer
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail && xcodebuild test-without-building \
            -scheme "SwiftAsyncStream-Package" \
            -destination "platform=macOS,arch=arm64" \
            -enableAddressSanitizer ${{ matrix.sanitizer == 'address' && 'YES' || 'NO' }} \
            -enableThreadSanitizer ${{ matrix.sanitizer == 'thread' && 'YES' || 'NO' }} \
            -only-testing:SwiftAsyncStreamTests/ContinuationLeakStressTests \
            -derivedDataPath .xcbuild 2>&1 | xcbeautify --renderer github-actions
